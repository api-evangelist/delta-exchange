aid: delta-exchange

name: Delta Exchange

image: https://static.delta.exchange/seo/india/delta_twitter_og_img.jpg

description: Delta Exchange is a derivatives-focused crypto exchange; Delta Exchange India (operated by Excelium Technologies
  Private Limited, FIU-registered) offers INR-settled perpetual futures, BTC and ETH call and put options and spot markets.
  It publishes a Swagger 2.0 REST API v2 (api.india.delta.exchange), WebSocket market and account feeds, a demo/testnet
  environment, official Python and Node REST clients, and an official local MCP server (delta-exchange-mcp on PyPI).

