apis:
- aid: delta-exchange:delta-exchange-rest-api-v2
  name: Delta Exchange India REST API v2
  description: REST API for Delta Exchange India covering assets, indices, products, tickers, option chains, orders (single,
    bracket, batch), a heartbeat-based dead man's switch, positions and margin, fills, wallet balances and transactions,
    sub-account transfers, OHLC candles, market maker protection, trading preferences and rate-limit quota. Private endpoints
    are signed with an API key, HMAC signature and timestamp.
  humanURL: https://docs.delta.exchange/
  baseURL: https://api.india.delta.exchange/v2
  tags:
  - Trading
  - Derivatives
  - Market Data
  properties:
  - type: OpenAPI
    url: openapi/delta-exchange-openapi.yml
  - type: OpenAPI
    name: OpenAPI (provider-hosted)
    url: https://docs.delta.exchange/api/swagger_v2.json
  - type: Documentation
    url: https://docs.delta.exchange/
- aid: delta-exchange:delta-exchange-mcp
  name: Delta Exchange MCP Server
  description: Official Delta Exchange MCP server (Python, published on PyPI as delta-exchange-mcp and run locally with
    uvx) exposing market data, account and trading tools over the Delta Exchange India API; market data needs no API key.
  humanURL: https://mcp.delta.exchange/
  baseURL: https://api.india.delta.exchange
  tags:
  - MCP
  - Agents
  properties:
  - type: Documentation
    url: https://mcp.delta.exchange/docs
  - type: SourceCode
    url: https://github.com/delta-exchange/delta-exchange-mcp
