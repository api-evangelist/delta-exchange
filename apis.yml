  name: Delta Exchange Orders API
  description: >-
    Placing Orders, Cancelling Orders, Placing batch orders, Cancelling batch orders, Get Open orders,
    Change Orders Leverage. Rate limits have been introduced recently that allows only set number of operations
    inside a matching engine in a timeframe. The current rate limits is 500 operations/sec for each product.
    For ex - placing 50 orders in a batch is equivalent to 50 operations as these orders will be processed
    by matching engine. Rate limits do not apply when cancelling orders.
  humanURL: https://docs.delta.exchange/
