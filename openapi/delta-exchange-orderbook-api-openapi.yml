openapi: 3.2.0
info:
  description: '## REST API for Delta Exchange

    Find out more on https://delta.exchange'
  version: 1.0.0
  title: Delta Exchange Orderbook API
  termsOfService: https://docs.google.com/document/d/e/2PACX-1vSDARn3b_VlmGZjJjlROm0MFpxX6KoLzVrqPZLSD4rh7sBhpP6kDP8WMSgUlaitwjCBUBd3-fV-MDId/pub
  contact:
    email: support@delta.exchange
servers:
- url: https://api.india.delta.exchange/
tags:
- name: Orderbook
  description: L2Orderbook
paths:
  /orderbook/{product_id}/l2:
    get:
      tags:
      - Orderbook
      operationId: getL2Orderbook
      summary: Get L2 orderbook
      parameters:
      - in: path
        name: product_id
        required: true
        schema:
          type: integer
      - in: query
        name: depth
        description: number of levels on each side
        schema:
          type: integer
      responses:
        '200':
          description: L2 orderbook for the product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/L2Orderbook'
components:
  schemas:
    L2Orderbook:
      type: object
      description: L2 orderbook
      properties:
        buy_book:
          type: array
          items:
            type: object
            properties:
              price:
                type: string
              size:
                type: integer
        sell_book:
          type: array
          items:
            type: object
            properties:
              price:
                type: string
              size:
                type: integer
        recent_trades:
          type: array
          items:
            type: object
            properties:
              side:
                type: string
                enum:
                - buy
                - sell
              size:
                type: integer
              price:
                type: string
              timestamp:
                type: integer
        spot_price:
          type: string
        mark_price:
          type: string
        product_id:
          type: integer
  securitySchemes:
    api-key:
      type: apiKey
      name: api-key
      in: header
    signature:
      type: apiKey
      name: signature
      in: header
    timestamp:
      type: apiKey
      name: timestamp
      in: header
