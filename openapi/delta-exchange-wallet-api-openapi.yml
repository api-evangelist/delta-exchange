openapi: 3.2.0
info:
  title: Delta Exchange Wallet API
  version: 1.0.0
  contact:
    email: support@delta.exchange
  termsOfService: https://docs.google.com/document/d/e/2PACX-1vSDARn3b_VlmGZjJjlROm0MFpxX6KoLzVrqPZLSD4rh7sBhpP6kDP8WMSgUlaitwjCBUBd3-fV-MDId/pub
  description: 'Operations tagged Wallet across 2 of this provider''s published API definitions: delta-exchange-swagger_v2.json, delta-exchange-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.india.delta.exchange/v2
tags:
- name: Wallet
  description: Get balances, Get transaction history
paths:
  /wallet/balances:
    get:
      tags:
      - Wallet
      operationId: getBalances
      summary: Get Wallet Balances
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: List of wallets attached to the user account
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/WalletPayload'
    servers:
    - url: https://api.india.delta.exchange/v2
  /wallet/transactions:
    get:
      tags:
      - Wallet
      summary: Get Wallet transactions
      operationId: getTransactions
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: query
        name: asset_ids
        description: comma separated list of asset_ids for which to get txns logs
        schema:
          type: integer
      - in: query
        name: start_time
        description: from time in micro-seconds in epoc
        schema:
          type: integer
      - in: query
        name: end_time
        description: from time in micro-seconds in epoc
        schema:
          type: integer
      - in: query
        name: after
        description: after cursor for pagination
        schema:
          type: string
      - in: query
        name: before
        description: before cursor for pagination
        schema:
          type: string
      - in: query
        name: page_size
        description: number of records per page
        schema:
          type: integer
          default: 10
      - in: query
        name: transaction_types
        description: transaction types to retrieve
        schema:
          $ref: '#/components/schemas/TransactionTypes'
      responses:
        '200':
          description: list of [Wallet transactions](#tocStransaction)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfTransactions'
                    meta:
                      $ref: '#/components/schemas/PaginationMeta'
    servers:
    - url: https://api.india.delta.exchange/v2
  /wallet/transactions/download:
    get:
      tags:
      - Wallet
      summary: Download Wallet transactions
      operationId: downloadTransactions
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: query
        name: asset_ids
        description: comma separated list of asset_ids
        schema:
          type: integer
      - in: query
        name: start_time
        description: from time in micro-seconds in epoc
        schema:
          type: integer
      - in: query
        name: end_time
        description: from time in micro-seconds in epoc
        schema:
          type: integer
      - in: query
        name: after
        description: after cursor for pagination
        schema:
          type: string
      - in: query
        name: before
        description: before cursor for pagination
        schema:
          type: string
      - in: query
        name: page_size
        description: number of records per page
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: csv of transactions for that wallet
    servers:
    - url: https://api.india.delta.exchange/v2
  /wallets/sub_account_balance_transfer:
    post:
      tags:
      - Wallet
      summary: Request asset transfer
      description: This api transfers asset from one subaccount to another subaccount or to the main/parent account. Please ensure that the subaccounts involved in the transfer should belong to the same parent account. Requests to transfer assets across subaccounts that belong to different parent accounts will fail. Please make sure that the api key used to make this api request belongs to the main/parent account.
      operationId: assetTransfer
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: Returns success message
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result: {}
        '400':
          description: Returns error code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetTransferSubaccountReq'
        required: true
    servers:
    - url: https://api.india.delta.exchange/v2
  /wallets/sub_accounts_transfer_history:
    get:
      tags:
      - Wallet
      summary: Request subaccount balance transfer history
      description: This api returns the wallet balance transfers for subaccounts belonging to the parent/main account of an api user. Make sure you are calling this api from the main account. If no subaccount is mentioned in the request, data for all the subacounts will be returned. Use page size to get more entries in a single request.
      operationId: SubaccountTransferHistory
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: Returns success message
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfSubaccountTransferLog'
                    meta:
                      $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Returns error code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubaccountTransferHistory'
        required: true
    servers:
    - url: https://api.india.delta.exchange/v2
components:
  schemas:
    Transaction:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: string
          description: amount credited/debited in this transaction (+ for credited, - for debited)
        balance:
          type: string
          description: net wallet balance after this transaction
        transaction_type:
          $ref: '#/components/schemas/TransactionTypes'
        meta_data:
          type: object
        product_id:
          type: integer
        asset_id:
          type: integer
        asset_symbol:
          type: integer
        created_at:
          type: string
    WalletPayload:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/WalletMetaData'
        result:
          $ref: '#/components/schemas/ArrayOfWallets'
        success:
          type: boolean
          default: true
    PaginationMeta:
      type: object
      properties:
        after:
          type: string
          description: after cursor for pagination; becomes null if page after the current one does not exist
          example: g3QAAAACZAAKY3JlYXRlZF9hdHQAAAAN
        before:
          type: string
          description: before cursor for pagination; becomes null if page before the current one does not exist
          example: a2PQRSACZAAKY3JlYXRlZF3fnqHBBBNZL
    SubaccountTransferLog:
      type: object
      properties:
        transferrer_user_id:
          type: string
          description: User id of the account debited with the asset.
        transferee_user_id:
          type: string
          description: User id of the account credited with the asset.
        asset_symbol:
          type: string
          description: Asset symbol transferred.
        amount:
          type: big_decimal
          description: Amount transferred.
        created_at:
          type: string
          description: transfer creation date and time
        transferee_user:
          type: object
          description: User details
        transferrer_user:
          type: object
          description: User details
    Wallet:
      type: object
      description: Wallet Data for each asset.
      properties:
        asset_id:
          type: integer
          description: Id for assets like BTC
        asset_symbol:
          type: string
          description: Symbol for assets like BTC
        available_balance:
          type: string
          description: Balance available for trading
        available_balance_for_robo:
          type: string
          description: Balance available for robo trading
        balance:
          type: string
          description: Total wallet balance
        blocked_margin:
          type: string
          description: Total blocked margin including commissions for all modes
        commission:
          type: string
          description: Commissions blocked in Isolated Mode
        cross_asset_liability:
          type: string
          description: Asset liability in Cross margin mode
        cross_commission:
          type: string
          description: Commision blocked in Cross margin mode
        cross_locked_collateral:
          type: string
          description: collateral blocked in Cross margin mode
        cross_order_margin:
          type: string
          description: margin blocked for open orders in Cross margin mode
        cross_position_margin:
          type: string
          description: margin blocked for open positions in Cross margin mode
        id:
          type: integer
          description: Wallet Id
        interest_credit:
          type: string
          description: Total interest credited
        order_margin:
          type: string
          description: margin blocked for open positions in isolated mode
        pending_referral_bonus:
          type: string
          description: Pending referral bonus
        pending_trading_fee_credit:
          type: string
          description: Credit of trading fee pending
        portfolio_margin:
          type: string
          description: Total margin blocked including commissions in portfolio margin mode
        position_margin:
          type: string
          description: Margin blocked in open positions in isolated mode
        trading_fee_credit:
          type: string
          description: Credit of trading fee
        unvested_amount:
          type: string
          description: Amount currently unvested
        user_id:
          type: integer
          description: User Id linked to this wallet
    TransactionTypes:
      type: string
      properties:
        transaction_type:
          type: string
          enum:
          - cashflow
          - deposit
          - withdrawal
          - commission
          - conversion
          - funding
          - settlement
          - liquidation_fee
          - spot_trade
          - withdrawal_cancellation
          - referral_bonus
          - sub_account_transfer
          - commission_rebate
          - promo_credit
          - trading_credits
          - trading_credits_forfeited
          - trading_credits_paid
          - trading_fee_credits_paid_liquidation_fee
          - trading_credits_reverted
          - interest_credit
          - external_deposit
          - credit_line
          - trading_competition
          - fund_deposit
          - fund_withdrawal
          - fund_wallet_deposit
          - fund_wallet_withdrawal
          - fund_reward
          - trade_farming_reward
          - interest_credit
          - revert
          - raf_bonus
          - fill_appropriation
          - incident_compensation
          x-enumDescriptions:
            cashflow: Generic cash credit or debit on the wallet
            deposit: Funds deposited into the wallet
            withdrawal: Funds withdrawn from the wallet
            commission: Trading commission charged on a fill
            conversion: Currency or asset conversion entry
            funding: Perpetual funding payment exchanged between long and short
            settlement: Wallet entry generated at contract settlement
            liquidation_fee: Fee charged when a position is liquidated
            spot_trade: Wallet entry from a spot trade
            withdrawal_cancellation: Reversal of a previously requested withdrawal
            referral_bonus: Bonus credited from the referral program
            sub_account_transfer: Transfer between a main account and a subaccount
            commission_rebate: Rebate paid back on previously charged commission
            promo_credit: Promotional credit added to the wallet
            trading_credits: Trading credits granted to the user
            trading_credits_forfeited: Trading credits forfeited (e.g. on expiry)
            trading_credits_paid: Trading credits applied toward trading fees
            trading_fee_credits_paid_liquidation_fee: Trading credits applied toward a liquidation fee
            trading_credits_reverted: Reversal of previously applied trading credits
            interest_credit: Interest credited on the wallet balance
            external_deposit: Deposit from an external/off-exchange source
            credit_line: Credit line adjustment on the wallet
            trading_competition: Wallet entry related to a trading competition
            fund_deposit: Deposit into a managed fund
            fund_withdrawal: Withdrawal from a managed fund
            fund_wallet_deposit: Deposit into the fund wallet
            fund_wallet_withdrawal: Withdrawal from the fund wallet
            fund_reward: Reward credited from a managed fund
            trade_farming_reward: Reward credited from the trade farming program
            revert: Reversal of a prior wallet transaction
            raf_bonus: Refer-a-friend bonus credited to the wallet
            fill_appropriation: Adjustment from appropriation of a fill
            incident_compensation: Compensation credited due to an incident
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        error:
          type: object
    ApiSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
    SubaccountTransferHistory:
      type: object
      properties:
        subaccount_user_id:
          type: string
          description: subaccount user id
        before:
          type: string
          description: before cursor for pagination
        after:
          type: string
          description: after cursor for pagination
        page_size:
          type: big_decimal
          description: records per page
          default: 10
    ArrayOfWallets:
      type: array
      description: Array of wallet for every asset
      items:
        $ref: '#/components/schemas/Wallet'
    ArrayOfSubaccountTransferLog:
      type: array
      items:
        $ref: '#/components/schemas/SubaccountTransferLog'
    AssetTransferSubaccountReq:
      type: object
      properties:
        transferrer_user_id:
          type: string
          description: Debit account
        transferee_user_id:
          type: string
          description: Credit account
        asset_symbol:
          type: string
          description: Asset to transfer
        amount:
          type: big_decimal
          description: Amount to transfer. Only postive values allowed.
    ArrayOfTransactions:
      type: array
      items:
        $ref: '#/components/schemas/Transaction'
    WalletMetaData:
      type: object
      description: Meta data for robo trading
      properties:
        net_equity:
          description: Net equity for robo trading
          type: string
        robo_trading_equity:
          description: trading equity for robo trading
          type: string
  securitySchemes:
    api-key:
      type: apiKey
      name: api-key
      in: header
    signature:
      type: apiKey
      name: signature
      in: header
    timestamp:
      type: apiKey
      name: timestamp
      in: header
x-refined-from:
- delta-exchange-swagger_v2.json
- delta-exchange-openapi.yml
