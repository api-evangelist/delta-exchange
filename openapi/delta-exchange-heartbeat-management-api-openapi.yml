openapi: 3.2.0
info:
  description: '## REST API for Delta Exchange

    Find out more on https://delta.exchange'
  version: 1.0.0
  title: Delta Exchange Heartbeat Management API
  termsOfService: https://docs.google.com/document/d/e/2PACX-1vSDARn3b_VlmGZjJjlROm0MFpxX6KoLzVrqPZLSD4rh7sBhpP6kDP8WMSgUlaitwjCBUBd3-fV-MDId/pub
  contact:
    email: support@delta.exchange
servers:
- url: https://api.india.delta.exchange/
tags:
- name: Heartbeat Management
paths:
  /heartbeat/create:
    post:
      tags:
      - Heartbeat Management
      summary: Create a new heartbeat for deadman switch
      operationId: createHeartbeat
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: Heartbeat created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHeartbeat'
        description: Heartbeat creation parameters
        required: true
  /heartbeat:
    post:
      tags:
      - Heartbeat Management
      summary: Send heartbeat acknowledgment
      operationId: sendHeartbeat
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: Heartbeat acknowledged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatAckResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatAck'
        description: Heartbeat acknowledgment parameters
        required: true
    get:
      tags:
      - Heartbeat Management
      summary: Get all active heartbeats
      operationId: getHeartbeats
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: query
        name: user_id
        description: User ID
        required: true
        schema:
          type: integer
      - in: query
        name: heartbeat_id
        description: Specific heartbeat ID to retrieve
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of active heartbeats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayOfHeartbeats'
components:
  schemas:
    ArrayOfHeartbeats:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: array
          items:
            $ref: '#/components/schemas/Heartbeat'
    HeartbeatConfig:
      type: object
      properties:
        action:
          type: string
          enum:
          - cancel_orders
          - spreads
          description: Action to take when heartbeat expires
        unhealthy_count:
          type: integer
          description: Number of unhealthy heartbeats before action
        tag:
          type: string
          description: Tag for the action (e.g., 'mmp')
      required:
      - action
      - unhealthy_count
    CreateHeartbeat:
      type: object
      properties:
        heartbeat_id:
          type: string
          description: Unique identifier for the heartbeat
        impact:
          type: string
          enum:
          - low
          - medium
          - high
          description: Impact level
        contract_types:
          type: array
          description: Array of contract types to monitor
          items:
            type: string
        underlying_assets:
          type: array
          description: Array of underlying assets to monitor
          items:
            type: string
        product_symbols:
          type: array
          description: Array of specific product symbols to monitor
          items:
            type: string
        config:
          type: array
          description: Array of action configurations
          items:
            $ref: '#/components/schemas/HeartbeatConfig'
      required:
      - heartbeat_id
      - impact
      - config
    HeartbeatAckResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: object
          properties:
            process_enabled:
              type: string
              description: Acknowledgement status (true/false)
            heartbeat_timestamp:
              type: string
              description: Expiry timestamp after which actions will be triggered
    HeartbeatResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: object
          properties:
            heartbeat_id:
              type: string
            status:
              type: string
    Heartbeat:
      type: object
      properties:
        heartbeat_id:
          type: string
        impact:
          type: string
        contract_types:
          type: array
          items:
            type: string
        underlying_assets:
          type: array
          items:
            type: string
        product_symbols:
          type: array
          items:
            type: string
        config:
          type: array
          items:
            $ref: '#/components/schemas/HeartbeatConfig'
        status:
          type: string
        last_ack:
          type: string
        next_ack_required_by:
          type: string
    HeartbeatAck:
      type: object
      properties:
        heartbeat_id:
          type: string
          description: Heartbeat identifier
        ttl:
          type: integer
          description: Time to live in milliseconds
      required:
      - heartbeat_id
      - ttl
  securitySchemes:
    api-key:
      type: apiKey
      name: api-key
      in: header
    signature:
      type: apiKey
      name: signature
      in: header
    timestamp:
      type: apiKey
      name: timestamp
      in: header
