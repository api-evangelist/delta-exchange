openapi: 3.2.0
info:
  title: Delta Exchange Products API
  version: 1.0.0
  contact:
    email: support@delta.exchange
  termsOfService: https://docs.google.com/document/d/e/2PACX-1vSDARn3b_VlmGZjJjlROm0MFpxX6KoLzVrqPZLSD4rh7sBhpP6kDP8WMSgUlaitwjCBUBd3-fV-MDId/pub
  description: 'Operations tagged Products across 2 of this provider''s published API definitions: delta-exchange-swagger_v2.json, delta-exchange-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.india.delta.exchange/v2
tags:
- name: Products
  description: Get Product List
paths:
  /products:
    get:
      tags:
      - Products
      summary: Get list of products
      description: The endpoint provides details about all available trading products on the platform. Each product represents a financial instrument like perpetual futures, options, or contracts for specific asset pairs.
      operationId: getProducts
      parameters:
      - in: query
        name: contract_types
        description: Comma separated list of contract types e.g. perpetual_futures,call_options, put_options
        schema:
          type: string
      - in: query
        name: states
        description: Comma separated list of states e.g. upcoming,live,expired,settled to get expired contracts.
        schema:
          type: string
      - in: query
        name: after
        description: after cursor for paginated request
        schema:
          type: string
      - in: query
        name: before
        description: before cursor for paginated request
        schema:
          type: string
      - in: query
        name: page_size
        description: 'size of a single page for paginated request, default: 100'
        schema:
          type: string
      - in: query
        name: expiry
        description: Expiry date in YYYY-MM-DD format to filter products by current & future expiry date.
        schema:
          type: string
      responses:
        '200':
          description: List of [Products](#tocSproduct)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfProducts'
    servers:
    - url: https://api.india.delta.exchange/v2
  /products/{symbol}:
    get:
      tags:
      - Products
      summary: Get product by symbol
      description: The endpoint retrieves details of a specific product identified by its symbol (e.g., BTCUSD, ETHUSD).
      operationId: getProduct
      parameters:
      - in: path
        name: symbol
        description: symbol of the desired product like BTCUSD, ETHUSD
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '[Product](#tocSproduct)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/Product'
    servers:
    - url: https://api.india.delta.exchange/v2
  /tickers:
    get:
      tags:
      - Products
      summary: Get tickers for products
      description: This endpoint retrieves the live tickers for available trading products, with an optional filter by specified contract types. The contract types should be provided as a comma-separated list (e.g., futures, perpetual_futures, call_options). If no contract type is specified, data for all available products will be returned.
      operationId: getTickers
      parameters:
      - name: contract_types
        in: query
        description: A comma-separated list of contract types to filter the tickers. Example values include perpetual_futures, call_options, put_options.
        required: false
        example: futures,perpetual_futures,call_options,put_options
        schema:
          type: string
      - name: underlying_asset_symbols
        in: query
        description: A comma-separated list of underlying asset symbols to filter the tickers. Example values include BTC, ETH, SOL etc.
        required: false
        example: BTC,ETH,SOL
        schema:
          type: string
      - name: expiry_date
        in: query
        description: 'Expiry date(format: DD-MM-YYYY) to filter the tickers.'
        required: false
        example: 03-04-2025
        schema:
          type: string
      responses:
        '200':
          description: List of live [tickers](#tocSticker) for all products, including implied volatility (IV) for option strikes.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfTickers'
    servers:
    - url: https://api.india.delta.exchange/v2
  /tickers/{symbol}:
    get:
      tags:
      - Products
      summary: Get ticker for a product by symbol
      description: This endpoint retrieves the ticker data for a specific product, identified by its symbol. The ticker data includes live price data, open interest, implied volatility (IV) for options, and other related market data.
      operationId: getTicker
      parameters:
      - in: path
        name: symbol
        description: 'The symbol(s) of the product, comma-separated. Maximum 10 symbols allowed. Example: (e.g., BTCUSD, ETHUSD).'
        required: true
        example: BTCUSD
        schema:
          type: string
      responses:
        '200':
          description: '[Ticker](#tocSticker) data for the requested product, including implied volatility (IV) for option strikes, if applicable.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/Ticker'
    servers:
    - url: https://api.india.delta.exchange/v2
  ? /tickers?contract_types=call_options,put_options&underlying_asset_symbols={underlying_asset_symbols}&expiry_date={expiry_date}
  : get:
      tags:
      - Products
      summary: Get option chain
      description: 'Fetch option chain data for a given product and expiry date.


        For example, to get BTC call and put options expiring on 04-04-2025, use:


        **contract_types=call_options,put_options&underlying_asset_symbols=BTC&expiry_date=04-04-2025**'
      operationId: getOptionChain
      parameters:
      - name: contract_types
        in: query
        description: A comma-separated list of contract types to filter the products. Only `call_options` and `put_options` are supported.
        example: call_options,put_options
        schema:
          type: string
      - name: underlying_asset_symbols
        in: query
        description: 'The underlying asset symbol (single value) for the option chain. Examples: `BTC`, `ETH`, `SOL`.'
        example: BTC
        schema:
          type: string
      - name: expiry_date
        in: query
        description: Expiry date of the contracts in `DD-MM-YYYY` format to filter by current & future expiry date.
        example: 03-04-2025
        schema:
          type: string
      responses:
        '200':
          description: Returns a list of live [tickers](#tocSticker) for all products, including **implied volatility (IV)** for option strikes.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfTickers'
    servers:
    - url: https://api.india.delta.exchange/v2
components:
  schemas:
    ArrayOfTickers:
      type: array
      items:
        $ref: '#/components/schemas/Ticker'
    Index:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the index.
          example: 14
        symbol:
          type: string
          description: Symbol representing the index, typically prefixed by '.DE' followed by base asset and quoting asset.
          example: .DEXBTUSD
        constituent_exchanges:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the constituent exchange.
                example: ExchangeA
              weight:
                type: number
                description: Weight of the exchange in the index.
                example: 0.25
          description: Details of constituent exchanges, including their names and weights in the index.
        underlying_asset_id:
          type: integer
          description: ID of the underlying asset for the index.
          example: 13
        quoting_asset_id:
          type: integer
          description: ID of the quoting asset for the index.
          example: 14
        tick_size:
          type: string
          description: Precision of the spot price in decimal format.
          example: '0.5'
        index_type:
          type: string
          description: Type of the index.
          enum:
          - spot_pair
          - fixed_interest_rate
          - floating_interest_rate
          x-enumDescriptions:
            spot_pair: Index based on a spot trading pair
            fixed_interest_rate: Index based on a fixed interest rate
            floating_interest_rate: Index based on a floating interest rate
          example: spot_pair
        config:
          type: object
          description: Composition config for the index.
          properties:
            price_alert_enabled:
              type: boolean
            quoting_asset:
              type: string
            service_id:
              type: integer
            underlying_asset:
              type: string
        description:
          type: string
          description: Description of the index.
        impact_size:
          type: string
          description: Impact size used for the index price computation.
        constituent_indices:
          type: object
          description: For composite indices, the expression and component indices used to compute this index.
          properties:
            expression:
              type: string
            indices:
              type: object
        health_interval:
          type: integer
          description: Interval, in seconds, at which the index health is checked.
        is_composite:
          type: boolean
          description: True if this index is derived from other indices via constituent_indices.
        price_method:
          type: string
          description: Method used to compute the index price.
      description: Details of an index used in trading, including its constituents and characteristics.
    ApiSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of a product or contract.
          example: 27
        symbol:
          type: string
          description: Symbol of the product or contract like BTCUSD, ETHUSD.
          example: BTCUSD
        description:
          type: string
          description: Detailed description of the product or contract.
          example: Bitcoin Perpetual futures, quoted, settled & margined in USD
        created_at:
          type: string
          description: Creation timestamp of the product or contract.
          example: '2023-12-18T13:10:39Z'
        updated_at:
          type: string
          description: Last update timestamp of the product or contract.
          example: '2024-11-15T02:47:50Z'
        settlement_time:
          type: string
          description: Settlement timestamp for futures contracts.
          example: null
        notional_type:
          type: string
          enum:
          - vanilla
          - inverse
          x-enumDescriptions:
            vanilla: Contract is quoted, settled, and margined in the quote currency
            inverse: Contract is quoted in the quote currency but settled and margined in the base currency
          description: Type of notional calculation.
          example: vanilla
        impact_size:
          type: integer
          description: Size of a typical trade used for mark price computation.
          example: 10000
        initial_margin:
          type: string
          description: Margin required to open a position.
          example: '0.5'
        maintenance_margin:
          type: string
          description: Minimum margin required to maintain a position.
          example: '0.25'
        contract_value:
          type: string
          description: Notional value of the contract (spot price x contract amount).
          example: '0.001'
        contract_unit_currency:
          type: string
          description: Unit of the contract (underlying asset or settling asset).
          example: BTC
        tick_size:
          type: string
          description: Minimum price interval between two successive prices.
          example: '0.5'
        product_specs:
          type: object
          description: Specifications related to contract types.
          $ref: '#/components/schemas/ProductSpecs'
        state:
          type: string
          enum:
          - live
          - expired
          - upcoming
          x-enumDescriptions:
            live: Product is currently active and tradable
            expired: Product has expired and is no longer tradable
            upcoming: Product is scheduled to go live in the future
          description: Current state of the product.
          example: live
        trading_status:
          type: string
          enum:
          - operational
          - disrupted_cancel_only
          - disrupted_post_only
          x-enumDescriptions:
            operational: Trading is fully operational; orders can be placed and cancelled
            disrupted_cancel_only: Trading is disrupted; only order cancellations are allowed
            disrupted_post_only: Trading is disrupted; only post-only orders are accepted
          description: Trading status of the contract.
          example: operational
        max_leverage_notional:
          type: string
          description: Maximum notional position size at the highest leverage.
          example: '100000'
        default_leverage:
          type: string
          description: Default leverage assigned to the product.
          example: '200'
        initial_margin_scaling_factor:
          type: string
          description: Scaling factor for initial margin.
          example: '0.0000025'
        maintenance_margin_scaling_factor:
          type: string
          description: Scaling factor for maintenance margin.
          example: '0.00000125'
        taker_commission_rate:
          type: string
          description: Commission rate for taker trades.
          example: '0.0005'
        maker_commission_rate:
          type: string
          description: Commission rate for maker trades.
          example: '0.0002'
        liquidation_penalty_factor:
          type: string
          description: Factor used to calculate liquidation penalty.
          example: '0.5'
        contract_type:
          type: string
          description: Type of contract (e.g., futures, perpetual).
          example: perpetual_futures
        position_size_limit:
          type: integer
          description: Maximum size for a single contract order.
          example: 229167
        basis_factor_max_limit:
          type: string
          description: Maximum value for annualized basis.
          example: '10.95'
        is_quanto:
          type: boolean
          description: Indicates if the contract is quanto.
          example: false
        funding_method:
          type: string
          description: Method used for funding calculation.
          example: mark_price
        annualized_funding:
          type: string
          description: Maximum allowed annualized funding rate.
          example: '10.95'
        price_band:
          type: string
          description: Price range allowed around the mark price (percentage).
          example: '2.5'
        underlying_asset:
          $ref: '#/components/schemas/Asset'
          description: Details of the underlying asset.
        quoting_asset:
          $ref: '#/components/schemas/Asset'
          description: Details of the quoting asset.
        settling_asset:
          $ref: '#/components/schemas/Asset'
          description: Details of the settling asset.
        spot_index:
          $ref: '#/components/schemas/Index'
          description: Spot index used for the product.
        disruption_reason:
          type: string
          description: Reason trading was disrupted. Null when trading_status is operational.
          example: null
        impact_notional:
          type: string
          description: Notional size of a typical trade used for mark price computation.
          example: '10000'
        position_notional_limit:
          type: string
          description: Maximum notional position size allowed. Null when not applicable.
          example: null
        auction_start_time:
          type: string
          description: Start timestamp of the settlement auction.
          example: '2026-08-13T05:51:51Z'
        settlement_price:
          type: string
          description: Settlement price of the contract. Null before settlement.
          example: null
        auction_finish_time:
          type: string
          description: Finish timestamp of the settlement auction. Null before the auction ends.
          example: null
        strike_price:
          type: string
          description: Strike price for an options contract. Null for non-options contracts.
          example: '63600'
        short_description:
          type: string
          description: Short form description of the product.
          example: BTC  Call
        ui_config:
          type: object
          description: Display configuration used by trading UIs. Not part of the core contract terms.
          properties:
            default_trading_view_candle:
              type: string
              example: '60'
            leverage_slider_values:
              type: array
              items:
                type: number
            price_clubbing_values:
              type: array
              items:
                type: number
            show_bracket_orders:
              type: boolean
            sort_priority:
              type: integer
            tags:
              type: array
              items:
                type: string
        launch_time:
          type: string
          description: Timestamp the product was launched for trading.
          example: '2020-04-20T08:37:05Z'
        insurance_fund_margin_contribution:
          type: string
          description: Contribution of this product's margin to the insurance fund.
          example: '5'
        barrier_price:
          type: string
          description: Barrier price for a barrier options contract. Null for other contract types.
          example: null
    ArrayOfProducts:
      type: array
      items:
        $ref: '#/components/schemas/Product'
    Asset:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the asset.
          example: 14
        symbol:
          type: string
          description: Symbol representing the asset.
          example: USD
        precision:
          type: integer
          description: Number of decimal places supported for the asset.
          example: 8
        deposit_status:
          type: string
          enum:
          - enabled
          - disabled
          x-enumDescriptions:
            enabled: Deposits are currently allowed for the asset
            disabled: Deposits are currently not allowed for the asset
          description: Indicates if deposits are enabled for the asset.
          example: enabled
        withdrawal_status:
          type: string
          enum:
          - enabled
          - disabled
          x-enumDescriptions:
            enabled: Withdrawals are currently allowed for the asset
            disabled: Withdrawals are currently not allowed for the asset
          description: Indicates if withdrawals are enabled for the asset.
          example: enabled
        base_withdrawal_fee:
          type: string
          description: Fixed withdrawal fee for the asset.
          example: '0.000000000000000000'
        min_withdrawal_amount:
          type: string
          description: Minimum allowable withdrawal amount for the asset.
          example: '0.000000000000000000'
        name:
          type: string
          description: Full name of the asset.
          example: US Dollar
        networks:
          type: array
          items:
            type: object
          description: Networks supported for depositing/withdrawing this asset. Shape not yet observed populated.
        interest_credit:
          type: boolean
          description: Whether interest is credited on balances of this asset.
          example: false
        interest_slabs:
          description: Interest rate slabs for this asset. Shape unknown - null in every sample observed so far.
          example: null
        kyc_deposit_limit:
          type: string
          description: Deposit limit for the asset before KYC is required.
          example: '0.000000000000000000'
        kyc_withdrawal_limit:
          type: string
          description: Withdrawal limit for the asset before KYC is required.
          example: '0.000000000000000000'
        minimum_precision:
          type: integer
          description: Minimum number of decimal places displayed for the asset.
          example: 2
        sort_priority:
          type: integer
          description: Display sort order for the asset. Null when not set.
          example: null
        variable_withdrawal_fee:
          type: string
          description: Variable withdrawal fee for the asset.
          example: '0.000000000000000000'
      description: Details of the asset used in the product or contract.
    greeks:
      type: object
      properties:
        delta:
          type: string
          description: The rate of change of the option price with respect to changes in the underlying asset price. A measure of sensitivity to the asset price movement.
          example: '0.25'
        gamma:
          type: string
          description: The rate of change of delta with respect to changes in the underlying asset price. A measure of the curvature of the option’s price sensitivity to the asset price.
          example: '0.10'
        rho:
          type: string
          description: The rate of change of the option price with respect to changes in the risk-free interest rate. A measure of interest rate sensitivity.
          example: '0.05'
        theta:
          type: string
          description: The rate of change of the option price with respect to time, often referred to as time decay. A measure of how the option's price declines as expiration approaches.
          example: '-0.02'
        vega:
          type: string
          description: The rate of change of the option price with respect to changes in the volatility of the underlying asset. A measure of volatility sensitivity.
          example: '0.15'
      description: The Greeks represent different factors that influence the pricing of options. These are key measures for assessing risk and managing option positions.
    price_band:
      type: object
      properties:
        lower_limit:
          type: string
          description: The minimum price limit for the product. It defines the lowest allowable price before triggering a price band constraint.
          example: '61120.45'
        upper_limit:
          type: string
          description: The maximum price limit for the product. It defines the highest allowable price before triggering a price band constraint.
          example: '72300.00'
      description: The price band defines the permissible price range for a product. The lower and upper limits represent the boundaries within which the product's price can fluctuate.
    ProductSpecs:
      type: object
      properties:
        funding_clamp_value:
          type: number
          description: The maximum allowable funding rate clamp value.
          example: 0.05
        only_reduce_only_orders_allowed:
          type: boolean
          description: Indicates whether only reduce-only orders are allowed.
          example: false
        expiry_interval:
          type: number
          description: The time interval, in seconds, after which the product or contract expires or settles.
          example: 28800
        isolated_liq_penalty_factor:
          type: number
          description: The penalty factor applied when an isolated margin position is liquidated.
          example: 0.01
        rate_exchange_interval:
          type: number
          description: The time interval, in seconds, at which funding rates are exchanged between long and short positions.
          example: 28800
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the product specifications.
          example:
          - layer_1
        vol_expiry_time:
          type: number
          description: Time interval, in seconds, used in volatility calculation. Seen on both perpetual and options contracts.
          example: 172800
        backup_vol_expiry_time:
          type: number
          description: Backup time interval, in seconds, used in volatility calculation when the primary window has insufficient data. Seen on options contracts.
          example: 31536000
        max_deviation_from_external_vol:
          type: number
          description: Maximum allowed deviation of internal volatility from the external volatility reference. Seen on options contracts.
          example: 0.75
        max_lower_deviation_from_external_vol:
          type: number
          description: Maximum allowed downward deviation of internal volatility from the external volatility reference. Seen on options contracts.
          example: 0.75
        max_upper_deviation_from_external_vol:
          type: number
          description: Maximum allowed upward deviation of internal volatility from the external volatility reference. Seen on options contracts.
          example: 0.5
        max_volatility:
          type: number
          description: Maximum volatility allowed in pricing. Seen on options contracts.
          example: 3
        min_volatility:
          type: number
          description: Minimum volatility allowed in pricing. Seen on options contracts.
          example: 0.1
        premium_commission_rate:
          type: number
          description: Commission rate applied on the option premium. Seen on options contracts.
          example: 0.1
        vol_calculation_method:
          type: string
          description: Method used to calculate volatility. Seen on options contracts.
          example: orderbook
      description: Specifications related to the specific product or contract. Which fields are present varies by contract_type - options contracts carry the volatility-related fields, perpetuals carry funding-related fields.
    quotes:
      type: object
      properties:
        ask_iv:
          type: string
          description: The implied volatility (IV) for the ask price. Represents the market's expectation of the future volatility of the underlying asset.
          example: '0.25'
        ask_size:
          type: string
          description: The size of the ask order, representing the quantity of the asset available for sale at the ask price.
          example: '100'
        best_ask:
          type: string
          description: The best (lowest) ask price available in the market for the asset.
          example: '150.00'
        best_bid:
          type: string
          description: The best (highest) bid price available in the market for the asset.
          example: '148.00'
        bid_iv:
          type: string
          description: The implied volatility (IV) for the bid price. Represents the market's expectation of future volatility for the bid side of the order book.
          example: '0.22'
        bid_size:
          type: string
          description: The size of the bid order, representing the quantity of the asset that buyers are willing to purchase at the bid price.
          example: '50'
      description: The 'quotes' object contains the latest bid and ask prices, their respective implied volatilities (IV), and order sizes for an asset. It provides key market data for understanding liquidity and pricing.
    Ticker:
      type: object
      properties:
        close:
          type: integer
          description: The closing price of the last trade for the product.
          example: 67321
        contract_type:
          type: string
          description: Comma-separated list of contract types, such as futures, perpetual_futures, call_options, put_options.
          example: futures
        greeks:
          $ref: '#/components/schemas/greeks'
          description: The Greek values for options associated with the ticker, including delta, gamma, vega, theta, and rho.
        high:
          type: number
          description: The highest price reached during the trading session.
          example: 68500.5
        low:
          type: number
          description: The lowest price reached during the trading session.
          example: 66300.25
        ltp_change_24h:
          type: string
          description: The percentage change in the last traded price over the last 24 hours.
          example: '0.7061'
        mark_price:
          type: string
          description: The market price of the product, reflecting the most recent transaction.
          example: '67000.00'
        mark_vol:
          type: string
          description: The market volume at the most recent trade price.
          example: '500'
        oi:
          type: string
          description: The open interest, or the number of outstanding contracts, for the product.
          example: '15000'
        oi_value:
          type: string
          description: The value of the open interest in the base currency.
          example: '1000000'
        oi_value_symbol:
          type: string
          description: The symbol representing the currency of the open interest value.
          example: USD
        oi_value_usd:
          type: string
          description: The open interest value converted to USD.
          example: '1050000'
        open:
          type: number
          description: The opening price at the start of the trading session.
          example: 67000.0
        price_band:
          $ref: '#/components/schemas/price_band'
          description: The price band within which the product’s price can fluctuate during the trading session.
        product_id:
          type: number
          description: A unique identifier for the product.
          example: 123456
