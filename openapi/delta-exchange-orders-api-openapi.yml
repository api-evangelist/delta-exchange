openapi: 3.2.0
info:
  description: '## REST API for Delta Exchange

    Find out more on https://delta.exchange'
  version: 1.0.0
  title: Delta Exchange Orders API
  termsOfService: https://docs.google.com/document/d/e/2PACX-1vSDARn3b_VlmGZjJjlROm0MFpxX6KoLzVrqPZLSD4rh7sBhpP6kDP8WMSgUlaitwjCBUBd3-fV-MDId/pub
  contact:
    email: support@delta.exchange
servers:
- url: https://api.india.delta.exchange/
tags:
- name: Orders
  description: Placing Orders, Cancelling Orders, Placing batch orders, Cancelling batch orders, Get Open orders, Change Orders Leverage
paths:
  /orders:
    post:
      tags:
      - Orders
      summary: Place Order
      operationId: placeOrder
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: Returns back the order object with assigned id and latest state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Returns [error](#place-order-error-description) if order could not be placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - InsufficientMargin
                    - OrderSizeExceededAvailable
                    - OrderExceedsSizeLimit
                    - OrderLeverageNotSet
                    - InvalidProduct
                    - ImmediateLiquidationOrder
                    - LowerthanBankruptcy
                    - SelfMatchingPostOnlyMode
                    - ImmediateExecutionPostOnlyOrder
                    - BracketOrderPositionExists
                    - InvalidBracketOrder
                  message:
                    type: string
                    description: A more verbose error message
      requestBody:
        content:
          application/json:
            schema:
              type: array
              $ref: '#/components/schemas/CreateOrderRequest'
        description: Order which needs to be created
        required: true
    delete:
      tags:
      - Orders
      summary: Cancel Order
      operationId: cancelOrder
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: Returns back the order object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Returns error if order could not be cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - ALREADY_FILLED
                    - InvalidOrder
                    - InvalidProduct
                  message:
                    type: string
                    description: A more verbose error message
      requestBody:
        content:
          application/json:
            schema:
              type: array
              $ref: '#/components/schemas/DeleteOrderRequest'
        description: Order which needs to be cancelled
        required: true
    get:
      tags:
      - Orders
      summary: Get Orders
      operationId: getOrders
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: query
        name: product_id
        description: get orders for a particular product id
        schema:
          type: integer
      - in: query
        name: state
        description: get orders with a particular state
        schema:
          type: string
          enum:
          - open
          - closed
          - cancelled
      - in: query
        name: stop_order_type
        description: get stop orders with stop_order_type
        schema:
          type: string
          enum:
          - stop_loss_order
      - in: query
        name: page_num
        description: page number for pagination
        schema:
          type: integer
          default: 1
      - in: query
        name: page_size
        description: page size for pagination
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: List of orders as per the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayOfOrders'
    put:
      tags:
      - Orders
      summary: Edit Order
      operationId: editOrder
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: Returns back the order object with assigned id and latest state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Returns [error](#place-order-error-description) if order could not be placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - InsufficientMargin
                    - OrderSizeExceededAvailable
                    - OrderExceedsSizeLimit
                    - OrderLeverageNotSet
                    - InvalidProduct
                    - ImmediateLiquidationOrder
                    - LowerthanBankruptcy
                    - SelfMatchingPostOnlyMode
                    - ImmediateExecutionPostOnlyOrder
                  message:
                    type: string
                    description: A more verbose error message
      requestBody:
        content:
          application/json:
            schema:
              type: array
              $ref: '#/components/schemas/EditOrderRequest'
        description: Order which needs to be edited
        required: true
  /orders/all:
    delete:
      tags:
      - Orders
      summary: Cancel all open orders
      operationId: cancelAllOrders
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: returns back success response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Returns error if orders could not be cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - InvalidProduct
                  message:
                    type: string
                    description: A more verbose error message
      requestBody:
        content:
          application/json:
            schema:
              type: array
              $ref: '#/components/schemas/CancelAllFilterObject'
        description: Filters for selecting orders that needs to be cancelled
  /orders/bracket:
    deprecated: true
    description: __DEPRECATED__
    post:
      tags:
      - Orders
      summary: Place Bracket Order __DEPRECATED__
      operationId: placeBracketOrder
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: Returns back the stop loss and take profit orders with assigned ids and latest states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BracketOrder'
        '400':
          description: Returns error if order could not be placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - ImmediateExecutionStopOrder
                    - CloseOnTriggerExists
                    - NoOpenPosition
                  message:
                    type: string
                    description: A more verbose error message
      requestBody:
        content:
          application/json:
            schema:
              type: array
              $ref: '#/components/schemas/CreateBracketOrderRequest'
        description: Bracket order which needs to be created
        required: true
  /orders/batch:
    post:
      tags:
      - Orders
      summary: Create batch orders
      operationId: batchCreate
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: returns the orders placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: returns error if orders couldnt be placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - InsufficientMargin
                    - OrderSizeExceededAvailable
                    - OrderExceedsSizeLimit
                    - OrderLeverageNotSet
                    - InvalidProduct
                    - ImmediateLiquidationOrder
                    - LowerthanBankruptcy
                  message:
                    type: string
                    description: A more verbose error message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrayOfCreateOrderRequest'
        description: Does not support time_in_force flag for orders, All orders in batch create are assumed to be gtc orders. batch create does not support stop orders, it support only limit orders
        required: true
    put:
      description: batch order edit
      summary: Edit batch orders
      tags:
      - Orders
      operationId: batchEdit
      deprecated: false
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: ''
          headers: {}
        '400':
          description: returns error if orders couldnt be edited
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - InsufficientMargin
                    - OrderSizeExceededAvailable
                    - OrderExceedsSizeLimit
                    - OrderLeverageNotSet
                    - InvalidProduct
                    - ImmediateLiquidationOrder
                    - LowerthanBankruptcy
                  message:
                    type: string
                    description: A more verbose error message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditBatchOrders'
        required: true
    delete:
      tags:
      - Orders
      summary: Delele batch orders
      operationId: batchDelete
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: returns the orders deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: returns error if orders couldnt be deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - ALREADY_FILLED
                    - InvalidOrder
                    - InvalidProduct
                  message:
                    type: string
                    description: A more verbose error message
      requestBody:
        content:
          application/json:
            schema:
              type: array
              $ref: '#/components/schemas/ArrayOfDeleteOrderRequest'
        required: true
  /orders/leverage:
    post:
      tags:
      - Orders
      summary: Change order leverage
      operationId: changeOrderLeverage
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: returns the OrderLeverage object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLeverage'
        '400':
          description: Returns error if leverage couldnt be changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - InsufficientMargin
                    - LeverageLimitExceeded
                  message:
                    type: string
                    description: A more verbose error message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - product_id
              - leverage
              properties:
                product_id:
                  type: integer
                leverage:
                  type: string
        required: true
    get:
      tags:
      - Orders
      summary: Get order leverage
      operationId: getOrderLeverage
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: query
        name: product_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: returns the OrderLeverage object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLeverage'
components:
  schemas:
    CreateBracketOrderRequest:
      deprecated: true
      type: object
      description: __DEPRECATED__  bracket order object
      properties:
        product_id:
          type: integer
        stop_loss_order:
          type: object
          properties:
            order_type:
              type: string
              enum:
              - market_order
            stop_price:
              type: string
        take_profit_order:
          type: object
          properties:
            order_type:
              type: string
              enum:
              - market_order
            stop_price:
              type: string
    OrderLeverage:
      type: object
      description: Order Leverage for a product
      properties:
        leverage:
          type: string
          description: Leverage of all open orders for this product
        order_margin:
          type: string
          description: Margin blocked in open orders for this product
        product_id:
          type: integer
    EditOrderRequest:
      type: object
      description: edit order object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        limit_price:
          type: string
        size:
          type: integer
          description: total size after editing order
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: id of a product or a contract
        symbol:
          type: string
          description: symbol of a product or a contract e.g. LINKBTC, XRPUSDQ
        description:
          type: string
          description: description of a product or a contract
        created_at:
          type: string
          description: product/contract creation date and time
        updated_at:
          type: string
          description: product/contract update date and time
        settlement_time:
          type: string
          description: settlement Timestamp of futures contract
        product_type:
          type: string
          enum:
          - future
          - inverse_future
          description: contract type 'future' or 'inverse_future'
        pricing_source:
          type: string
          description: source and method of contract pricing
        impact_size:
          type: integer
          description: size of a typical trade. Used in the computation of mark price
        initial_margin:
          type: integer
          description: The amount required to enter into a new position
        maintenance_margin:
          type: string
          description: 'The amount necessary when a loss on a futures position requires you to allocate more funds to return the margin to the initial margin level. '
        contract_value:
          type: string
          description: The notional value of a futures contract is simply the spot price of the asset multiplied by the amount of the asset specified in the contract
        contract_unit_currency:
          type: string
          description: This is the unit of  1 contract, for vanilla futures, its underlying asset. for inverse, it is settling asset. for quanto, its settling asset / quoting asset
        tick_size:
          type: string
          description: The minimum gap between 2 consecutive prices.
        trading_status:
          type: string
          enum:
          - operational
          - disrupted_cancel_only
          - disrupted_post_only
          description: 'trading status of the contract e.g. ''operational'',''disrupted_cancel_only'' or ''disrupted_post_only'' '
        max_leverage_notional:
          type: string
          description: maximum notional position size (in settling asset terms) that can be acquired at highest allowed leverage for a given contract.
        default_leverage:
          type: string
          description: default leverage
        initial_margin_scaling_factor:
          type: string
        maintenance_margin_scaling_factor:
          type: string
        commission_rate:
          type: string
          description: rate at which commission fee will be calculated for a trade in given contract
        maker_commission_rate:
          type: string
          description: rate at which maker rebate will be calculated
        liquidation_penalty_factor:
          type: string
          description: 'Determines liquidation charge as per the following formula: liquidation_penalty_factor * minimum maintenance margin'
        contract_type:
          type: string
          description: ' Type of contracts e.g. futures, perpetual futures, '
        position_size_limit:
          type: integer
          description: Maximum size of contracts in a single order can be placed
        basis_factor_max_limit:
          type: string
          description: Maximum allowed value of annualized basis
        is_quanto:
          type: boolean
          description: Flag which denotes whether future contract is quanto or not
        funding_method:
          type: string
          description: Method used to calculate funding for given contract. e.g. Fixed or mark price
        annualized_funding:
          type: string
          description: Maximum allowed value of funding, expressed as annual rate.
        price_band:
          type: string
          description: he range around mark price in which trading is allowed. This number is in percentage.
        underlying_asset:
          $ref: '#/components/schemas/Asset'
        quoting_asset:
          $ref: '#/components/schemas/Asset'
        settling_asset:
          $ref: '#/components/schemas/Asset'
    ArrayOfDeleteOrderRequest:
      type: array
      items:
        $ref: '#/components/schemas/DeleteOrderRequest'
    ArrayOfOrders:
      type: array
      items:
        $ref: '#/components/schemas/Order'
    BatchEditOrders:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: Order id to be edited
        size:
          type: integer
          format: int32
        limit_price:
          type: string
        product_id:
          type: integer
          format: int32
      required:
      - id
      - size
      - limit_price
      - product_id
    EditBatchOrders:
      type: object
      properties:
        product_id:
          type: integer
          format: int32
        orders:
          type: array
          items:
            $ref: '#/components/schemas/BatchEditOrders'
      required:
      - product_id
      - orders
    Order:
      type: object
      description: An Order object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        size:
          type: integer
        unfilled_size:
          type: integer
        side:
          type: string
          description: side for which to place order
          enum:
          - buy
          - sell
        order_type:
          type: string
          enum:
          - limit_order
          - market_order
        limit_price:
          type: string
        stop_order_type:
          type: string
          enum:
          - stop_loss_order
        stop_price:
          type: string
        close_on_trigger:
          type: string
          enum:
          - 'false'
          - 'true'
        state:
          type: string
          description: Order Status
          enum:
          - open
          - pending
          - closed
          - cancelled
        created_at:
          type: string
        product:
          $ref: '#/components/schemas/Product'
    DeleteOrderRequest:
      type: object
      description: A delete order object
      properties:
        id:
          type: integer
        product_id:
          type: integer
    CreateOrderRequest:
      type: object
      description: A create order object
      properties:
        product_id:
          type: integer
          required: true
        limit_price:
          type: string
        size:
          type: integer
        side:
          type: string
          description: side for which to place order
          enum:
          - buy
          - sell
        order_type:
          type: string
          enum:
          - limit_order
          - market_order
        time_in_force:
          type: string
          enum:
          - gtc
          - ioc
          required: false
        post_only:
          type: string
          enum:
          - 'true'
          - 'false'
        reduce_only:
          type: string
          enum:
          - 'true'
          - 'false'
        bracket_order:
          deprecated: true
          description: _DEPRECATED_
          type: object
          properties:
            stop_loss_price:
              type: string
            take_profit_price:
              type: string
            trail_amount:
              type: string
    BracketOrder:
      deprecated: true
      description: __DEPRECATED__
      type: object
      properties:
        stop_loss_order:
          $ref: '#/components/schemas/Order'
        take_profit_order:
          $ref: '#/components/schemas/Order'
    Asset:
      type: object
      properties:
        id:
          type: integer
          format: int64
        symbol:
          type: string
        precision:
          type: integer
    CancelAllFilterObject:
      type: object
      description: Cancel all request filter object
      properties:
        product_id:
          type: integer
          description: cancel all orders for particular product, cancels orders for all products if not provided
          required: false
        cancel_limit_orders:
          type: string
          description: set as true to cancel open limit orders
          enum:
          - 'true'
          - 'false'
          required: false
        cancel_stop_orders:
          type: string
          description: set as true to cancel stop orders
          enum:
          - 'true'
          - 'false'
          required: false
    ArrayOfCreateOrderRequest:
      type: array
      items:
        $ref: '#/components/schemas/CreateOrderRequest'
  securitySchemes:
    api-key:
      type: apiKey
      name: api-key
      in: header
    signature:
      type: apiKey
      name: signature
      in: header
    timestamp:
      type: apiKey
      name: timestamp
      in: header
