openapi: 3.2.0
info:
  description: '## REST API for Delta Exchange

    Find out more on https://delta.exchange'
  version: 1.0.0
  title: Delta Exchange Assets API
  termsOfService: https://docs.google.com/document/d/e/2PACX-1vSDARn3b_VlmGZjJjlROm0MFpxX6KoLzVrqPZLSD4rh7sBhpP6kDP8WMSgUlaitwjCBUBd3-fV-MDId/pub
  contact:
    email: support@delta.exchange
servers:
- url: https://api.india.delta.exchange/
tags:
- name: Assets
  description: Get Asset List
paths:
  /assets:
    get:
      tags:
      - Assets
      summary: Get list of all assets
      operationId: getAssets
      responses:
        '200':
          description: List of all assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayOfAssets'
components:
  schemas:
    ArrayOfAssets:
      type: array
      items:
        $ref: '#/components/schemas/Asset'
    Asset:
      type: object
      properties:
        id:
          type: integer
          format: int64
        symbol:
          type: string
        precision:
          type: integer
  securitySchemes:
    api-key:
      type: apiKey
      name: api-key
      in: header
    signature:
      type: apiKey
      name: signature
      in: header
    timestamp:
      type: apiKey
      name: timestamp
      in: header
