openapi: 3.2.0
info:
  title: Delta Exchange Indices API
  version: 1.0.0
  contact:
    email: support@delta.exchange
  termsOfService: https://docs.google.com/document/d/e/2PACX-1vSDARn3b_VlmGZjJjlROm0MFpxX6KoLzVrqPZLSD4rh7sBhpP6kDP8WMSgUlaitwjCBUBd3-fV-MDId/pub
  description: 'Operations tagged Indices across 2 of this provider''s published API definitions: delta-exchange-swagger_v2.json, delta-exchange-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.india.delta.exchange/v2
tags:
- name: Indices
  description: Get Indices List
paths:
  /indices:
    get:
      tags:
      - Indices
      operationId: getIndices
      summary: Get indices
      description: Indices refer to spot price indices that Delta Exchange creates by combining spot prices of prominent crypto exchanges. These indices form the underlying of futures and options contracts listed on Delta Exchange. All details of indices on Delta Exchange are available here.
      responses:
        '200':
          description: List of [Spot Index schema](#tocSindex)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfIndices'
    servers:
    - url: https://api.india.delta.exchange/v2
components:
  schemas:
    Index:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the index.
          example: 14
        symbol:
          type: string
          description: Symbol representing the index, typically prefixed by '.DE' followed by base asset and quoting asset.
          example: .DEXBTUSD
        constituent_exchanges:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the constituent exchange.
                example: ExchangeA
              weight:
                type: number
                description: Weight of the exchange in the index.
                example: 0.25
          description: Details of constituent exchanges, including their names and weights in the index.
        underlying_asset_id:
          type: integer
          description: ID of the underlying asset for the index.
          example: 13
        quoting_asset_id:
          type: integer
          description: ID of the quoting asset for the index.
          example: 14
        tick_size:
          type: string
          description: Precision of the spot price in decimal format.
          example: '0.5'
        index_type:
          type: string
          description: Type of the index.
          enum:
          - spot_pair
          - fixed_interest_rate
          - floating_interest_rate
          x-enumDescriptions:
            spot_pair: Index based on a spot trading pair
            fixed_interest_rate: Index based on a fixed interest rate
            floating_interest_rate: Index based on a floating interest rate
          example: spot_pair
        config:
          type: object
          description: Composition config for the index.
          properties:
            price_alert_enabled:
              type: boolean
            quoting_asset:
              type: string
            service_id:
              type: integer
            underlying_asset:
              type: string
        description:
          type: string
          description: Description of the index.
        impact_size:
          type: string
          description: Impact size used for the index price computation.
        constituent_indices:
          type: object
          description: For composite indices, the expression and component indices used to compute this index.
          properties:
            expression:
              type: string
            indices:
              type: object
        health_interval:
          type: integer
          description: Interval, in seconds, at which the index health is checked.
        is_composite:
          type: boolean
          description: True if this index is derived from other indices via constituent_indices.
        price_method:
          type: string
          description: Method used to compute the index price.
      description: Details of an index used in trading, including its constituents and characteristics.
    ApiSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
    ArrayOfIndices:
      type: array
      items:
        $ref: '#/components/schemas/Index'
  securitySchemes:
    api-key:
      type: apiKey
      name: api-key
      in: header
    signature:
      type: apiKey
      name: signature
      in: header
    timestamp:
      type: apiKey
      name: timestamp
      in: header
x-refined-from:
- delta-exchange-swagger_v2.json
- delta-exchange-openapi.yml
