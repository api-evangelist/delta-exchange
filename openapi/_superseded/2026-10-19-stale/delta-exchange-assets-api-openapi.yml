openapi: 3.2.0
info:
  title: Delta Exchange Assets API
  version: 1.0.0
  contact:
    email: support@delta.exchange
  termsOfService: https://docs.google.com/document/d/e/2PACX-1vSDARn3b_VlmGZjJjlROm0MFpxX6KoLzVrqPZLSD4rh7sBhpP6kDP8WMSgUlaitwjCBUBd3-fV-MDId/pub
  description: 'Operations tagged Assets across 2 of this provider''s published API definitions: delta-exchange-swagger_v2.json, delta-exchange-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.india.delta.exchange/v2
tags:
- name: Assets
  description: Get Asset List
paths:
  /assets:
    get:
      tags:
      - Assets
      summary: Get list of all assets
      operationId: getAssets
      responses:
        '200':
          description: List of [Asset schema](#tocSasset)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfAssets'
    servers:
    - url: https://api.india.delta.exchange/v2
components:
  schemas:
    ArrayOfAssets:
      type: array
      items:
        $ref: '#/components/schemas/Asset'
    ApiSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
    Asset:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the asset.
          example: 14
        symbol:
          type: string
          description: Symbol representing the asset.
          example: USD
        precision:
          type: integer
          description: Number of decimal places supported for the asset.
          example: 8
        deposit_status:
          type: string
          enum:
          - enabled
          - disabled
          x-enumDescriptions:
            enabled: Deposits are currently allowed for the asset
            disabled: Deposits are currently not allowed for the asset
          description: Indicates if deposits are enabled for the asset.
          example: enabled
        withdrawal_status:
          type: string
          enum:
          - enabled
          - disabled
          x-enumDescriptions:
            enabled: Withdrawals are currently allowed for the asset
            disabled: Withdrawals are currently not allowed for the asset
          description: Indicates if withdrawals are enabled for the asset.
          example: enabled
        base_withdrawal_fee:
          type: string
          description: Fixed withdrawal fee for the asset.
          example: '0.000000000000000000'
        min_withdrawal_amount:
          type: string
          description: Minimum allowable withdrawal amount for the asset.
          example: '0.000000000000000000'
        name:
          type: string
          description: Full name of the asset.
          example: US Dollar
        networks:
          type: array
          items:
            type: object
          description: Networks supported for depositing/withdrawing this asset. Shape not yet observed populated.
        interest_credit:
          type: boolean
          description: Whether interest is credited on balances of this asset.
          example: false
        interest_slabs:
          description: Interest rate slabs for this asset. Shape unknown - null in every sample observed so far.
          example: null
        kyc_deposit_limit:
          type: string
          description: Deposit limit for the asset before KYC is required.
          example: '0.000000000000000000'
        kyc_withdrawal_limit:
          type: string
          description: Withdrawal limit for the asset before KYC is required.
          example: '0.000000000000000000'
        minimum_precision:
          type: integer
          description: Minimum number of decimal places displayed for the asset.
          example: 2
        sort_priority:
          type: integer
          description: Display sort order for the asset. Null when not set.
          example: null
        variable_withdrawal_fee:
          type: string
          description: Variable withdrawal fee for the asset.
          example: '0.000000000000000000'
      description: Details of the asset used in the product or contract.
  securitySchemes:
    api-key:
      type: apiKey
      name: api-key
      in: header
    signature:
      type: apiKey
      name: signature
      in: header
    timestamp:
      type: apiKey
      name: timestamp
      in: header
x-refined-from:
- delta-exchange-swagger_v2.json
- delta-exchange-openapi.yml
