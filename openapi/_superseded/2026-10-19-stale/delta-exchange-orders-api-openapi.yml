openapi: 3.2.0
info:
  title: Delta Exchange Orders API
  version: 1.0.0
  contact:
    email: support@delta.exchange
  termsOfService: https://docs.google.com/document/d/e/2PACX-1vSDARn3b_VlmGZjJjlROm0MFpxX6KoLzVrqPZLSD4rh7sBhpP6kDP8WMSgUlaitwjCBUBd3-fV-MDId/pub
  description: 'Operations tagged Orders across 2 of this provider''s published API definitions: delta-exchange-swagger_v2.json, delta-exchange-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.india.delta.exchange/v2
tags:
- name: Orders
  description: Placing Orders, Cancelling Orders, Placing batch orders, Cancelling batch orders, Get Open orders, Change Orders Leverage. Rate limits have been introduced recently that allows only set number of operations inside a matching engine in a timeframe. The current rate limits is 500 operations/sec for each product. For ex - placing 50 orders in a batch is equivalent to 50 operations as these orders will be processed by matching engine. Rate limits do not apply when cancelling orders.
paths:
  /orders:
    post:
      tags:
      - Orders
      summary: Place Order
      operationId: placeOrder
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: Returns back the order object with assigned id and latest state
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/Order'
        '400':
          description: Returns [error](#place-order-error-description) if order could not be placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        description: Order which needs to be created. Rate limits apply.
        required: true
    delete:
      tags:
      - Orders
      summary: Cancel Order
      operationId: cancelOrder
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: Returns back the order object
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/Order'
        '400':
          description: Returns error if order could not be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOrderRequest'
        description: Order which needs to be cancelled
        required: true
    put:
      tags:
      - Orders
      summary: Edit Order
      operationId: editOrder
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: Returns back the order object with assigned id and latest state
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/Order'
        '400':
          description: Returns [error](#place-order-error-description) if order could not be placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditOrderRequest'
        description: Order which needs to be edited. Rate limits apply.
        required: true
    get:
      summary: Get Active Orders
      tags:
      - Orders
      operationId: getOrders
      deprecated: false
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: query
        name: product_ids
        description: Comma-separated product IDs. Maximum 10 IDs allowed. If not specified, all the orders will be returned
        example: 27,5
        schema:
          type: string
      - in: query
        name: states
        description: comma separated list of states - open,pending
        example: open, pending, closed
        schema:
          type: string
      - in: query
        name: contract_types
        description: comma separated list of desired contract types, if not specified any parameters then, all the orders will be returned
        x-enumDescriptions:
          futures: Dated futures contracts with a fixed expiry
          perpetual_futures: Futures contracts with no expiry, funded via funding rate
          call_options: Call option contracts
          put_options: Put option contracts
        example: futures, perpetual_futures, call_options
        schema:
          type: string
          enum:
          - futures
          - perpetual_futures
          - call_options
          - put_options
      - in: query
        name: order_types
        description: comma separated order types
        x-enumDescriptions:
          market: Market order executed at the best available price
          limit: Limit order placed at a specified price
          stop_market: Stop order that triggers a market order at the stop price
          stop_limit: Stop order that triggers a limit order at the stop price
          all_stop: All stop orders (stop_market and stop_limit)
        example: market, limit, stop_limit
        schema:
          type: string
          enum:
          - market
          - limit
          - stop_market
          - stop_limit
          - all_stop
      - in: query
        name: start_time
        description: from time in micro-seconds in epoc; referring to the order creation time
        example: 1725174294000000
        schema:
          type: integer
      - in: query
        name: end_time
        description: from time in micro-seconds in epoc; referring to the order creation time
        example: 1725865494000000
        schema:
          type: integer
      - in: query
        name: after
        description: after cursor for pagination; becomes null if page after the current one does not exist
        example: g3QAAAACZAAKY3JlYXRlZF9hdHQAAAAN
        schema:
          type: string
      - in: query
        name: before
        description: before cursor for pagination; becomes null if page before the current one does not exist
        example: a2PQRSACZAAKY3JlYXRlZF3fnqHBBBNZL
        schema:
          type: string
      - in: query
        name: page_size
        description: number of records per page
        example: 50
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: List of orders as per the query
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfOrders'
                    meta:
                      $ref: '#/components/schemas/PaginationMeta'
    servers:
    - url: https://api.india.delta.exchange/v2
  /orders/bracket:
    post:
      tags:
      - Orders
      summary: Place Bracket order
      description: A bracket order is a set of TP and SL order. For a bracket order , size need not be specified as it closes the entire position. For a given contract, you can have multiple bracket orders for open orders but only a single bracket order for any open position.
      operationId: bracketOrder
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: returns back success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '400':
          description: Returns error if orders could not be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBracketOrderRequest'
        description: 'Bracket Order which needs to be updated '
        required: true
    put:
      tags:
      - Orders
      summary: Edit Bracket order
      description: A bracket order is a set of TP and SL order. You can specify bracket order with an order that will create a new position. Use this api to change the bracket params attached with an order.
      operationId: putOrdersBracket
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: returns back success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '400':
          description: Returns error if orders could not be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditBracketOrderRequest'
        description: 'Bracket Order which needs to be updated '
        required: true
      x-operation-id-source: normalized
      x-operation-id-original: bracketOrder
    servers:
    - url: https://api.india.delta.exchange/v2
  /orders/all:
    delete:
      tags:
      - Orders
      summary: Cancel all open orders
      description: Cancels all orders for a given product id. If product id is not provided, it cancels orders for provided contract types. If none of them are provided, it cancels all the orders. Provide either product id or list of contract types at a time. If both are provided, contract types will be ignored.
      operationId: cancelAllOrders
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: returns back success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessResponse'
        '400':
          description: Returns error if orders could not be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAllFilterObject'
        description: Filters for selecting orders that needs to be cancelled
    servers:
    - url: https://api.india.delta.exchange/v2
  /orders/batch:
    post:
      tags:
      - Orders
      summary: Create batch orders
      description: Orders in a batch should belong to the same contract. Max allowed size limit in a batch is 50. Rate limits apply. Please note that ioc is not valid time in force values for creating batch orders.
      operationId: batchCreate
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: returns the orders placed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfOrders'
        '400':
          description: returns error if orders couldnt be placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: '#/components/schemas/BatchCreateOrdersRequest'
        description: Does not support time_in_force flag for orders, All orders in batch create are assumed to be gtc orders. batch create does not support stop orders, it support only limit orders
        required: true
    put:
      description: Orders to be edited in a batch. Rate limits apply.
      summary: Edit batch orders
      tags:
      - Orders
      operationId: batchEdit
      deprecated: false
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: List of edited orders
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfOrders'
        '400':
          description: returns error if orders couldnt be edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: '#/components/schemas/BatchEditOrdersRequest'
        required: true
    delete:
      tags:
      - Orders
      summary: Delete batch orders
      operationId: batchDelete
      security:
      - api-key: []
        signature: []
        timestamp: []
      responses:
        '200':
          description: returns the orders deleted
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfOrders'
        '400':
          description: returns error if orders couldnt be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: '#/components/schemas/BatchDeleteOrdersRequest'
        required: true
    servers:
    - url: https://api.india.delta.exchange/v2
  /orders/{order_id}:
    get:
      tags:
      - Orders
      summary: Get Order by id
      operationId: getOrderById
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: path
        name: order_id
        description: Id of the order
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Returns back the order object with assigned id and latest state
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/Order'
    servers:
    - url: https://api.india.delta.exchange/v2
  /orders/client_order_id/{client_oid}:
    get:
      tags:
      - Orders
      summary: Get Order by client oid
      operationId: getOrderByCOI
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: path
        name: client_oid
        description: Custom user provided order id (max 32 length)
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Returns back the order object with assigned client order id and latest state
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/Order'
    servers:
    - url: https://api.india.delta.exchange/v2
  /products/{product_id}/orders/leverage:
    post:
      tags:
      - Orders
      summary: Change order leverage
      operationId: changeOrderLeverage
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: path
        name: product_id
        description: Product id of the ordered product. Either product_id or product_symbol must be preseent.
        required: true
        example: 27
        schema:
          type: integer
      - in: path
        name: product_symbol
        description: Product symbol of the ordered product. Either product_id or product_symbol must be preseent.
        required: true
        example: BTCUSD
        schema:
          type: string
      responses:
        '200':
          description: returns the OrderLeverage object
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/OrderLeverage'
        '400':
          description: Returns error if leverage couldnt be changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - leverage
              properties:
                leverage:
                  type: string
                  description: Order leverage
                  example: 10
        required: true
    get:
      tags:
      - Orders
      summary: Get order leverage
      operationId: getOrderLeverage
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: path
        name: product_id
        description: Product id of the ordered product
        required: true
        example: 27
        schema:
          type: integer
      responses:
        '200':
          description: returns the OrderLeverage object
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/OrderLeverage'
    servers:
    - url: https://api.india.delta.exchange/v2
components:
  schemas:
    ArrayOfOrders:
      type: array
      items:
        $ref: '#/components/schemas/Order'
    BatchCreateOrder:
      type: object
      description: A create order object
      required:
      - size
      - side
      - order_type
      properties:
        limit_price:
          type: string
          description: Price level for limit orders
          example: '59000'
        size:
          type: integer
          description: Order size
          example: 10
        side:
          type: string
          description: Buy order or Sell order
          enum:
          - buy
          - sell
          x-enumDescriptions:
            buy: Buy order on the product
            sell: Sell order on the product
          example: buy
        order_type:
          type: string
          description: Limit order(limit_price must be defined) or Market order
          enum:
          - limit_order
          - market_order
          x-enumDescriptions:
            limit_order: Order placed at a specified limit price
            market_order: Order executed at the best available market price
          default: market_order
          example: limit_order
        time_in_force:
          type: string
          description: GTC/IOC order type
          enum:
          - gtc
          - ioc
          x-enumDescriptions:
            gtc: Good-till-cancelled; order stays open until filled or cancelled
            ioc: Immediate-or-cancel; unfilled portion is cancelled immediately
          example: gtc
        mmp:
          type: string
          description: MMP level for the order - disabled/mmp1/mmp2/mmp3/mmp4/mmp5
          enum:
          - disabled
          - mmp1
          - mmp2
          - mmp3
          - mmp4
          - mmp5
          example: disabled
        post_only:
          type: string
          description: Post only order
          enum:
          - 'true'
          - 'false'
          x-enumDescriptions:
            'true': Order is rejected if it would take liquidity from the orderbook
            'false': Order is allowed to take liquidity from the orderbook
          default: false
          example: false
        client_order_id:
          type: string
          description: custom id to be set for the order, provided by user. Must be unique across all open orders of the user (max 32 length)
          example: my_signal_34521712
    OrderLeverage:
      type: object
      description: Order Leverage for a product
      properties:
        leverage:
          type: string
          description: Leverage of all open orders for this product
          example: 10
        order_margin:
          type: string
          description: Margin blocked in open orders for this product
          example: '563.2'
        product_id:
          type: integer
          description: Product id of the ordered product
          example: 27
    BatchDeleteOrdersRequest:
      type: object
      oneOf:
      - required:
        - product_id
      - required:
        - product_symbol
      properties:
        product_id:
          type: integer
          description: Only one of either product_id or product_symbol must be sent.
          example: 27
        product_symbol:
          type: string
          description: Only one of either product_id or product_symbol must be sent.
          example: BTCUSD
        orders:
          type: array
          items:
            $ref: '#/components/schemas/BatchDeleteOrder'
    EditBracketOrderRequest:
      type: object
      description: bracket order object
      required:
      - id
      - product_id
      - product_symbol
      properties:
        id:
          type: integer
          required: true
          description: Order ID for which bracket params are being updated
          example: 34521712
        product_id:
          type: integer
          description: Only one of either product_id or product_symbol must be sent.
          example: 27
        product_symbol:
          type: string
          description: Only one of either product_id or product_symbol must be sent.
          example: BTCUSD
        bracket_stop_loss_limit_price:
          type: string
          description: stop loss limit price for bracket order
          example: '55000'
        bracket_stop_loss_price:
          type: string
          description: stop loss trigger price for bracket order
          example: '56000'
        bracket_take_profit_limit_price:
          type: string
          description: take profit limit price for bracket order
          example: '65000'
        bracket_take_profit_price:
          type: string
          description: take profit trigger price for bracket order
          example: '64000'
        bracket_trail_amount:
          type: string
          description: trail amount of bracket order
          example: '50'
        bracket_stop_trigger_method:
          type: string
          description: stop order trigger method for bracket orders- mark_price/last_traded_price/spot_price
          enum:
          - mark_price
          - last_traded_price
          - spot_price
          x-enumDescriptions:
            mark_price: Bracket order triggered against the mark price
            last_traded_price: Bracket order triggered against the last traded price
            spot_price: Bracket order triggered against the spot index price
          default: mark_price
          example: last_traded_price
    PaginationMeta:
      type: object
      properties:
        after:
          type: string
          description: after cursor for pagination; becomes null if page after the current one does not exist
          example: g3QAAAACZAAKY3JlYXRlZF9hdHQAAAAN
        before:
          type: string
          description: before cursor for pagination; becomes null if page before the current one does not exist
          example: a2PQRSACZAAKY3JlYXRlZF3fnqHBBBNZL
    CancelAllFilterObject:
      type: object
      description: Cancel all request filter object
      properties:
        product_id:
          type: integer
          description: Only one of either product_id or product_symbol must be sent.
          example: 27
        contract_types:
          type: string
          description: comma separated list of desired contract types
          example: perpetual_futures,put_options,call_options
        cancel_limit_orders:
          type: string
          description: set true to cancel open limit orders
          enum:
          - 'true'
          - 'false'
          x-enumDescriptions:
            'true': Include open limit orders in the cancellation
            'false': Exclude open limit orders from the cancellation
          example: false
        cancel_stop_orders:
          type: string
          description: set as true to cancel stop orders
          enum:
          - 'true'
          - 'false'
          x-enumDescriptions:
            'true': Include open stop orders in the cancellation
            'false': Exclude open stop orders from the cancellation
          example: false
        cancel_reduce_only_orders:
          type: string
          description: set as true to cancel reduce only orders
          enum:
          - 'true'
          - 'false'
          x-enumDescriptions:
            'true': Include open reduce-only orders in the cancellation
            'false': Exclude open reduce-only orders from the cancellation
          example: false
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        error:
          type: object
    ApiSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
    BatchDeleteOrder:
      type: object
      description: A delete order object
      properties:
        id:
          type: integer
          description: use bracket trail amount if you want a trailing stop order. Required if bracket stop price is empty
          example: 13452112
        client_order_id:
          type: string
          description: client order id of the order to be cancelled. Since client order id is unique across all open orders of the user, it can be used to uniquely identify the order (max 32 length)
          example: my_signal_34521712
    CreateOrderRequest:
      type: object
      description: A create order object
      required:
      - product_id
      - product_symbol
      - size
      - side
      - order_type
      properties:
        product_id:
          type: integer
          description: Only one of either product_id or product_symbol must be sent.
          example: 27
        product_symbol:
          type: string
          description: Only one of either product_id or product_symbol must be sent.
          example: BTCUSD
        limit_price:
          type: string
          description: Price level for limit orders
          example: '59000'
        size:
          type: integer
          description: Order size
          example: 10
        side:
          type: string
          description: Buy order or Sell order
          enum:
          - buy
          - sell
          x-enumDescriptions:
            buy: Buy order on the product
            sell: Sell order on the product
          example: buy
        order_type:
          type: string
          description: Limit order(limit_price must be defined) or Market order
          enum:
          - limit_order
          - market_order
          x-enumDescriptions:
            limit_order: Order placed at a specified limit price
            market_order: Order executed at the best available market price
          default: market_order
          example: limit_order
        stop_order_type:
          type: string
          description: Stop order type - stop loss or take profit. liquidation_order is not accepted here; it is only ever generated by the system and returned in responses.
          enum:
          - stop_loss_order
          - take_profit_order
          x-enumDescriptions:
            stop_loss_order: Order triggered when stop price is hit to limit losses
            take_profit_order: Order triggered when take profit price is hit to lock in gains
          example: stop_loss_order
        stop_price:
          type: string
          description: Stop loss price level if the order is stop order
          example: '56000'
        trail_amount:
          type: string
          description: Use trail amount if you want a trailing stop order. Required if stop price is empty.
          example: '50'
        stop_trigger_method:
          type: string
          description: Stop order trigger method - mark_price/last_traded_price/spot_price
          enum:
          - mark_price
          - last_traded_price
          - spot_price
          x-enumDescriptions:
            mark_price: Order triggered against the mark price
            last_traded_price: Order triggered against the last traded price
            spot_price: Order triggered against the spot index price
          default: mark_price
          example: last_traded_price
        bracket_stop_trigger_method:
          type: string
          description: stop order trigger method for bracket orders - mark_price/last_traded_price/spot_price
          enum:
          - mark_price
          - last_traded_price
          - spot_price
