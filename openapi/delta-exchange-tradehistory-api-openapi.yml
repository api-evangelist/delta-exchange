openapi: 3.2.0
info:
  title: Delta Exchange Trade History API
  version: 1.0.0
  contact:
    email: support@delta.exchange
  termsOfService: https://docs.google.com/document/d/e/2PACX-1vSDARn3b_VlmGZjJjlROm0MFpxX6KoLzVrqPZLSD4rh7sBhpP6kDP8WMSgUlaitwjCBUBd3-fV-MDId/pub
  description: 'Operations tagged TradeHistory across 2 of this provider''s published API definitions: delta-exchange-swagger_v2.json, delta-exchange-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.india.delta.exchange/v2
tags:
- name: TradeHistory
  description: Get Orders History, Get Fill History
paths:
  /orders/history:
    get:
      tags:
      - TradeHistory
      summary: Get order history (cancelled and closed)
      operationId: getOrderHistory
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: query
        name: product_ids
        description: Comma separated product IDs. Maximum 10 IDs allowed.
        schema:
          type: string
      - in: query
        name: contract_types
        description: comma separated list of desired contract types
        schema:
          type: string
      - in: query
        name: order_types
        description: comma separated order types
        x-enumDescriptions:
          market: Market order executed at the best available price
          limit: Limit order placed at a specified price
          stop_market: Stop order that triggers a market order at the stop price
          stop_limit: Stop order that triggers a limit order at the stop price
          all_stop: All stop orders (stop_market and stop_limit)
        schema:
          type: string
          enum:
          - market
          - limit
          - stop_market
          - stop_limit
          - all_stop
      - in: query
        name: start_time
        description: from time in micro-seconds in epoc
        schema:
          type: integer
      - in: query
        name: end_time
        description: from time in micro-seconds in epoc
        schema:
          type: integer
      - in: query
        name: after
        description: after cursor for pagination
        schema:
          type: string
      - in: query
        name: before
        description: before cursor for pagination
        schema:
          type: string
      - in: query
        name: page_size
        description: number of records per page
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: List of closed and cancelled orders. [Order schema](#tocSorder)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfOrders'
                    meta:
                      $ref: '#/components/schemas/PaginationMeta'
    servers:
    - url: https://api.india.delta.exchange/v2
  /fills:
    get:
      summary: GET user fills by filters
      tags:
      - TradeHistory
      operationId: getUserfills
      deprecated: false
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: query
        name: product_ids
        description: Comma separated product IDs. Maximum 10 IDs allowed.
        schema:
          type: string
      - in: query
        name: contract_types
        description: comma separated list of desired contract types
        schema:
          type: string
      - in: query
        name: start_time
        description: from time in micro-seconds in epoc
        schema:
          type: integer
      - in: query
        name: end_time
        description: from time in micro-seconds in epoc
        schema:
          type: integer
      - in: query
        name: after
        description: after cursor for pagination
        schema:
          type: string
      - in: query
        name: before
        description: before cursor for pagination
        schema:
          type: string
      - in: query
        name: page_size
        description: number of records per page
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: Array of [fills](#tocSfill)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiSuccessResponse'
                - type: object
                  properties:
                    result:
                      $ref: '#/components/schemas/ArrayOfFills'
                    meta:
                      $ref: '#/components/schemas/PaginationMeta'
    servers:
    - url: https://api.india.delta.exchange/v2
  /fills/history/download/csv:
    get:
      tags:
      - TradeHistory
      summary: Download Fills history
      operationId: downloadFillsHistory
      security:
      - api-key: []
        signature: []
        timestamp: []
      parameters:
      - in: query
        name: product_ids
        description: comma separated product ids
        schema:
          type: string
      - in: query
        name: contract_types
        description: comma separated list of desired contract types
        schema:
          type: string
      - in: query
        name: start_time
        description: from time in micro-seconds in epoc
        schema:
          type: integer
      - in: query
        name: end_time
        description: from time in micro-seconds in epoc
        schema:
          type: integer
      responses:
        '200':
          description: csv of fills for the filter query
    servers:
    - url: https://api.india.delta.exchange/v2
components:
  schemas:
    Fill:
      type: object
      description: A fill object
      properties:
        id:
          type: string
          description: 'UUID string uniquely identifying the fill. Confirmed as a UUID for every fill_type: normal, liquidation, settlement, adl and otc.'
          example: 071b551365574d0aad99557931137dbd
        size:
          type: string
          description: Fill size, sent as string.
          example: '1'
        notional:
          type: string
          description: Notional value of the fill (price * size * contract value), sent as string.
          example: '63.788'
        product:
          type: object
          description: Truncated details of the traded product. Not the full Product object - only the fields observed below.
          properties:
            id:
              type: integer
            symbol:
              type: string
            contract_type:
              type: string
              enum:
              - futures
              - perpetual_futures
              - call_options
              - put_options
            tick_size:
              type: string
            contract_value:
              type: string
            contract_unit_currency:
              type: string
            notional_type:
              type: string
              enum:
              - vanilla
              - inverse
            quoting_asset:
              type: object
              properties:
                symbol:
                  type: string
                precision:
                  type: integer
                minimum_precision:
                  type: integer
            underlying_asset:
              type: object
              properties:
                symbol:
                  type: string
                precision:
                  type: integer
                minimum_precision:
                  type: integer
            settling_asset:
              type: object
              properties:
                symbol:
                  type: string
                precision:
                  type: integer
                minimum_precision:
                  type: integer
            spot_index:
              type: object
              properties:
                symbol:
                  type: string
        fill_type:
          type: string
          enum:
          - normal
          - adl
          - liquidation
          - settlement
          - otc
          x-enumDescriptions:
            normal: Regular fill from matching against the orderbook
            adl: Fill from auto-deleveraging to balance counterparty exposure
            liquidation: Fill resulting from forced liquidation of a position
            settlement: Fill generated at contract settlement or expiry
            otc: Off-exchange (over-the-counter) fill
        side:
          type: string
          enum:
          - buy
          - sell
          x-enumDescriptions:
            buy: Buy order on the product
            sell: Sell order on the product
        price:
          type: string
          description: Price at which the fill happened, BigDecimal sent as string
        role:
          type: string
          enum:
          - taker
          - maker
          x-enumDescriptions:
            taker: Fill where the user removed liquidity from the orderbook
            maker: Fill where the user added liquidity to the orderbook
        commission:
          type: string
          description: Commission paid on this fill, negative value means commission was earned because of maker role
        created_at:
          type: string
        product_id:
          type: integer
        product_symbol:
          type: string
        order_id:
          type: string
          description: Will be order_id(Integer) in most cases. Will be UUID string of order when fill_type is settlement
        settling_asset_id:
          type: integer
        settling_asset_symbol:
          type: string
        meta_data:
          $ref: '#/components/schemas/FillMetaData'
    FillMetaData:
      type: object
      description: 'Meta data inside fill. Which fields are present varies by fill_type, confirmed across all 5 values. normal and liquidation carry the full field set below, including ip/mark/spot/source and a fuller new_position. settlement only carries order_price/order_size/order_type/order_unfilled_size, the commission-related fields, and a minimal new_position (size, commission, sometimes margin) - no ip/mark/spot/source or liquidation-fee fields. adl carries the same fields as liquidation but source and ip are null, order_type is adl_order, new_position can be minimal (sometimes only size/realized_pnl/realized_cashflow), and it may carry a cut object. otc is the sparsest: only order_price/order_size/order_type, commission_deto(_in_settling_asset), effective_commission_rate, original_referrer_commission, trading_fee_credits_used, and sometimes cut - no new_position, no ip/mark/spot/source, no liquidation-fee fields.'
      properties:
        commission_deto:
          type: string
        commission_deto_in_settling_asset:
          type: string
        effective_commission_rate:
          type: string
        liquidation_fee_deto:
          type: string
        liquidation_fee_deto_in_settling_asset:
          type: string
        order_price:
          type: string
        order_size:
          type: string
        order_type:
          type: string
        order_unfilled_size:
          type: string
        tfc_used_for_commission:
          type: string
        tfc_used_for_liquidation_fee:
          type: string
        total_commission_in_settling_asset:
          type: string
        total_liquidation_fee_in_settling_asset:
          type: string
        ip:
          type: string
          description: IP address the order that generated this fill was placed from.
        is_commission_on_notional:
          type: boolean
          description: True if commission is charged on notional value rather than a fixed rate.
        liquidation_fee_in_settling_asset:
          type: string
          description: Liquidation fee charged on this fill, in the settling asset.
        mark:
          type: string
          description: Mark price at the time of the fill.
        rack_commision:
          type: string
          description: Commission before any trading-credit offsets are applied.
        source:
          type: string
          description: Client/platform the order was placed from, e.g. desktop. System-generated fills (e.g. liquidation) show system. Null for adl fills.
        spot:
          type: string
          description: Spot index price at the time of the fill.
        cut:
          type: object
          description: Auto-deleveraging queue ranking info. Seen on the maker side of adl fills and on otc fills.
          properties:
            equity:
              type: number
            api_trader:
              type: number
        trading_fee_credits_used:
          type: string
          description: Trading fee credits applied toward this fill's commission. Seen on otc fills.
        original_referrer_commission:
          type: string
          description: Referrer commission before any adjustments. Seen on liquidation fills.
        new_position:
          type: object
          description: Snapshot of the position immediately after this fill was applied.
          properties:
            size:
              type: integer
            margin:
              type: string
            entry_price:
              type: string
              description: Present when the resulting position size is non-zero. Absent (not just null) when the position was closed flat by this fill.
            liquidation_price:
              type: string
              description: Null until the engine has priced the position.
            bankruptcy_price:
              type: string
              description: Null until the engine has priced the position.
            commission:
              type: string
            total_commission_paid:
              type: string
              description: Present when the resulting position size is non-zero. Absent (not just null) when the position was closed flat by this fill.
            realized_pnl:
              type: string
            realized_cashflow:
              type: string
            realized_funding:
              type: string
            last_fill_uuid:
              type: string
              description: Present when the resulting position size is non-zero. Absent (not just null) when the position was closed flat by this fill.
    ArrayOfOrders:
      type: array
      items:
        $ref: '#/components/schemas/Order'
    PaginationMeta:
      type: object
      properties:
        after:
          type: string
          description: after cursor for pagination; becomes null if page after the current one does not exist
          example: g3QAAAACZAAKY3JlYXRlZF9hdHQAAAAN
        before:
          type: string
          description: before cursor for pagination; becomes null if page before the current one does not exist
          example: a2PQRSACZAAKY3JlYXRlZF3fnqHBBBNZL
    ApiSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
    ArrayOfFills:
      type: array
      items:
        $ref: '#/components/schemas/Fill'
    Order:
      type: object
      description: An Order object
      properties:
        id:
          type: integer
          description: Genraeted order id
          example: 123
        user_id:
          type: integer
          description: Client id
          example: 453671
        size:
          type: integer
          description: Order size
          example: 10
        unfilled_size:
          type: integer
          description: Order size which is not filled yet
          example: 2
        side:
          type: string
          description: Side for which to place order
          enum:
          - buy
          - sell
          x-enumDescriptions:
            buy: Buy order on the product
            sell: Sell order on the product
          example: buy
        order_type:
          type: string
          description: Order type - limit_order/market_order
          enum:
          - limit_order
          - market_order
          x-enumDescriptions:
            limit_order: Order placed at a specified limit price
            market_order: Order executed at the best available market price
          example: limit_order
        limit_price:
          type: string
          description: Price level on which order must be triggered. Null for market orders.
          example: '59000'
        stop_order_type:
          type: string
          description: Stop order type - stop loss, take profit, or liquidation. Null when the order is not a stop order. liquidation_order is generated by the system when a position is force-closed and cannot be submitted in a create order request.
          enum:
          - stop_loss_order
          - take_profit_order
          - liquidation_order
          x-enumDescriptions:
            stop_loss_order: Order triggered when stop price is hit to limit losses
            take_profit_order: Order triggered when take profit price is hit to lock in gains
            liquidation_order: Order automatically generated by the system to close a position during liquidation
          example: stop_loss_order
        stop_price:
          type: string
          description: Stop price level for the stop order. Null when the order is not a stop order.
          example: '55000'
        average_fill_price:
          type: string
          description: Average price at which the order has been filled. Null for unfilled orders.
          example: '8999.00'
        bracket_order:
          type: boolean
          description: True if this is a bracket order, false otherwise.
          example: false
        bracket_stop_loss_price:
          type: string
          description: Bracket order stop loss trigger price.
          example: '56000'
        bracket_stop_loss_limit_price:
          type: string
          description: Bracket order stop loss limit price.
          example: '57000'
        bracket_take_profit_price:
          type: string
          description: Take profit trigger price for bracket order.
          example: '61000'
        bracket_take_profit_limit_price:
          type: string
          description: Bracket order take profit limit price.
          example: '62000'
        bracket_trail_amount:
          type: string
          description: Trail amount for a trailing bracket stop order.
          example: '50'
        trail_amount:
          type: string
          description: Trail amount for a trailing stop order. Null unless the order is a trailing stop order.
          example: '50'
        cancellation_reason:
          type: string
          description: Reason the order was cancelled. Null unless state is cancelled.
          example: cancelled_by_user
        mmp:
          type: string
          description: MMP level applied to the order - disabled/mmp1/mmp2/mmp3/mmp4/mmp5
          enum:
          - disabled
          - mmp1
          - mmp2
          - mmp3
          - mmp4
          - mmp5
          example: disabled
        stop_trigger_method:
          type: string
          description: Stop order trigger method - mark_price/last_traded_price/spot_price
          enum:
          - mark_price
          - last_traded_price
          - spot_price
          x-enumDescriptions:
            mark_price: Order triggered against the mark price
            last_traded_price: Order triggered against the last traded price
            spot_price: Order triggered against the spot index price
          example: last_traded_price
        time_in_force:
          type: string
          description: GTC/IOC order type
          enum:
          - gtc
          - ioc
          x-enumDescriptions:
            gtc: Good-till-cancelled; order stays open until filled or cancelled
            ioc: Immediate-or-cancel; unfilled portion is cancelled immediately
          example: gtc
        updated_at:
          type: string
          description: Updated at unix timestamp of the order in micro seconds.
          example: '1725865012000000'
        paid_commission:
          type: string
          description: Commission paid for filled order
          example: '0.5432'
        commission:
          type: string
          description: Commission blocked for order
          example: '0.5432'
        reduce_only:
          type: string
          description: if set, will only close positions. New orders will not be placed
          enum:
          - 'false'
          - 'true'
          x-enumDescriptions:
            'false': Order can open or increase a position
            'true': Order can only reduce or close an existing position
          default: false
          example: false
        client_order_id:
          type: string
          description: custom id provided by user when creating order. Must be unique across all open orders of the user (max 32 length)
          example: my_signal_34521712
        state:
          type: string
          description: Order Status
          enum:
          - open
          - pending
          - closed
          - cancelled
          x-enumDescriptions:
            open: Order is active and resting in the orderbook
            pending: Order is waiting for its trigger condition to be met
            closed: Order has been fully filled
            cancelled: Order was cancelled before being fully filled
          example: open
        created_at:
          type: string
          description: Created at unix timestamp of the order in micro seconds
          example: '1725865012000000'
        product_id:
          type: integer
          description: Product id of the ordered product
          example: 27
        product_symbol:
          type: string
          description: Product symbol of the ordered product
          example: BTCUSD
  securitySchemes:
    api-key:
      type: apiKey
      name: api-key
      in: header
    signature:
      type: apiKey
      name: signature
      in: header
    timestamp:
      type: apiKey
      name: timestamp
      in: header
